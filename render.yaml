# Render Blueprint for the FastAPI backend (free plan).
# Render dashboard → New → Blueprint → pick this repo. It will ask for the values marked sync: false.
services:
  - type: web
    name: researchpanel-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.13
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL # Neon connection string (postgresql://...)
        sync: false
      - key: CORS_ORIGINS # your Vercel URL, e.g. https://researchpanel-ngo.vercel.app
        sync: false
      - key: DEMO_PASSWORD # password for the demo accounts created on first start
        sync: false
